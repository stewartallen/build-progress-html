<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            name="description"
            content="Construction progress for an RV-10 aircraft kit: daily build hours, streaks and completion estimates."
        />
        <meta name="color-scheme" content="light dark" />
        <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
        <title>RV-10 Build Progress</title>
        <!-- RV-10 plan view: cowl and cabin, constant-chord wing with raked
             tips, tapered tail cone, square-tipped stabilizer. -->
        <link
            rel="icon"
            type="image/svg+xml"
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230d1117'/><g fill='%2339d353'><path d='M16 3.1C17.8 4.1 18.6 5.5 18.6 7.6V14.6L16.85 27.9H15.15L13.4 14.6V7.6C13.4 5.5 14.2 4.1 16 3.1Z'/><path d='M3 10.2H29L30.8 11V14.8L29 15.6H3L1.2 14.8V11Z'/><path d='M9.6 24.2H22.4V27.4H9.6Z'/></g></svg>"
        />

        <style>
            /* ---------------------------------------------------------------
               Design tokens. Light is the base; dark overrides below. Every
               colour lives here so the palette has exactly one home.
               --------------------------------------------------------------- */
            :root {
                color-scheme: light dark;

                --bg: #ffffff;
                --surface: #f6f8fa;
                --border: #d0d7de;
                --text: #1f2328;
                --text-strong: #010409;
                --text-muted: #59636e;
                --accent: #0969da;
                --danger: #cf222e;
                --danger-text: #ffffff;
                --tooltip-bg: #24292f;
                --tooltip-text: #ffffff;
                --shadow: 0 8px 24px rgb(31 35 40 / 12%);

                /* GitHub contribution scale, light variant. */
                --level-0: #ebedf0;
                --level-1: #9be9a8;
                --level-2: #40c463;
                --level-3: #30a14e;
                --level-4: #216e39;
                --cell-stroke: rgb(27 31 35 / 6%);

                --radius: 6px;
                --gap: clamp(0.75rem, 2vw, 1.25rem);
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #0d1117;
                    --surface: #161b22;
                    --border: #30363d;
                    --text: #c9d1d9;
                    --text-strong: #f0f6fc;
                    --text-muted: #8b949e;
                    --accent: #58a6ff;
                    --danger: #f85149;
                    --tooltip-bg: #1c2128;
                    --shadow: 0 8px 24px rgb(1 4 9 / 40%);

                    /* GitHub contribution scale, dark variant. */
                    --level-0: #30363d;
                    --level-1: #0e4429;
                    --level-2: #006d32;
                    --level-3: #26a641;
                    --level-4: #39d353;
                    --cell-stroke: rgb(255 255 255 / 5%);
                }
            }

            /* --------------------------------------------------------------- */

            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }

            :where(body, h1, h2, h3, p, dl, dd, figure) {
                margin: 0;
            }

            body {
                padding: clamp(0.75rem, 2.5vw, 1.5rem);
                background-color: var(--bg);
                color: var(--text);
                font-family:
                    system-ui,
                    -apple-system,
                    'Segoe UI',
                    Roboto,
                    sans-serif;
                line-height: 1.6;
                -webkit-text-size-adjust: 100%;
            }

            .page {
                max-inline-size: 1400px;
                margin-inline: auto;
            }

            .page > * + * {
                margin-block-start: clamp(1.5rem, 4vw, 2.5rem);
            }

            h1 {
                font-size: clamp(1.5rem, 1.1rem + 2vw, 2.5rem);
                font-weight: 600;
                line-height: 1.2;
                letter-spacing: -0.02em;
                color: var(--text-strong);
            }

            h2 {
                font-size: clamp(1.05rem, 0.95rem + 0.5vw, 1.35rem);
                font-weight: 600;
                color: var(--text-strong);
            }

            .sr-only {
                position: absolute;
                inline-size: 1px;
                block-size: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip-path: inset(50%);
                white-space: nowrap;
                border: 0;
            }

            /* Status line: doubles as the loading message and the error banner. */
            .status {
                margin-block-start: 0.4rem;
                font-size: 0.9375rem;
                color: var(--text-muted);
            }

            .status[data-state='error'] {
                padding: 0.75rem 1rem;
                border-radius: var(--radius);
                background-color: var(--danger);
                color: var(--danger-text);
            }

            /* Statistics --------------------------------------------------- */

            .stats {
                display: grid;
                /* min() lets cards go full width on phones without a breakpoint. */
                grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr));
                gap: var(--gap);
            }

            .stat {
                padding: clamp(0.9rem, 2vw, 1.25rem);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                background-color: var(--surface);
            }

            .stat__label {
                font-size: 0.8125rem;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: var(--text-muted);
            }

            .stat__body {
                display: flex;
                flex-direction: column;
                margin-block-start: 0.4rem;
            }

            .stat__value {
                font-size: clamp(1.3rem, 1.05rem + 0.9vw, 1.8rem);
                font-weight: 600;
                line-height: 1.25;
                font-variant-numeric: tabular-nums;
                color: var(--accent);
            }

            .stat__note {
                font-size: 0.875rem;
                color: var(--text-muted);
            }

            /* Activity heatmap --------------------------------------------- */

            .section-head {
                display: flex;
                flex-wrap: wrap;
                align-items: baseline;
                justify-content: space-between;
                gap: 0.5rem 1rem;
                margin-block-end: 1rem;
            }

            .legend {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                font-size: 0.8125rem;
                color: var(--text-muted);
            }

            .legend__scale {
                display: flex;
                gap: 3px;
            }

            .legend__swatch {
                inline-size: 12px;
                block-size: 12px;
                border-radius: 2px;
                background-color: var(--level-0);
                box-shadow: inset 0 0 0 1px var(--cell-stroke);
            }

            .legend__swatch[data-level='1'] {
                background-color: var(--level-1);
            }
            .legend__swatch[data-level='2'] {
                background-color: var(--level-2);
            }
            .legend__swatch[data-level='3'] {
                background-color: var(--level-3);
            }
            .legend__swatch[data-level='4'] {
                background-color: var(--level-4);
            }

            .years {
                display: flex;
                flex-direction: column;
                gap: clamp(1.25rem, 3vw, 2rem);
            }

            .year__title {
                margin-block-end: 0.6rem;
                font-size: clamp(1rem, 0.9rem + 0.4vw, 1.25rem);
                font-weight: 600;
                color: var(--text-strong);
            }

            .year__chart {
                padding: clamp(0.75rem, 2vw, 1.25rem);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                background-color: var(--surface);
                /* Below the SVG's min-width the chart scrolls instead of
                   shrinking cells into unreadable dots. */
                overflow-x: auto;
                overscroll-behavior-x: contain;
                scrollbar-width: thin;
            }

            .heatmap {
                display: block;
                inline-size: 100%;
                block-size: auto;
            }

            .heatmap text {
                font-size: 11px;
                fill: var(--text-muted);
            }

            .heatmap .day {
                fill: var(--level-0);
                stroke: var(--cell-stroke);
                stroke-width: 1;
                transition: stroke 100ms ease;
            }

            .heatmap .day[data-level='1'] {
                fill: var(--level-1);
            }
            .heatmap .day[data-level='2'] {
                fill: var(--level-2);
            }
            .heatmap .day[data-level='3'] {
                fill: var(--level-3);
            }
            .heatmap .day[data-level='4'] {
                fill: var(--level-4);
            }

            .heatmap .day:hover {
                stroke: var(--text-strong);
                stroke-width: 1.5;
            }

            /* Tooltip ------------------------------------------------------ */

            .tooltip {
                position: fixed;
                inset-block-start: 0;
                inset-inline-start: 0;
                z-index: 10;
                max-inline-size: 18rem;
                padding: 0.35rem 0.6rem;
                border-radius: var(--radius);
                background-color: var(--tooltip-bg);
                color: var(--tooltip-text);
                font-size: 0.8125rem;
                line-height: 1.4;
                pointer-events: none;
                box-shadow: var(--shadow);
                translate: var(--tip-x, 0) var(--tip-y, 0);
            }

            [hidden] {
                display: none !important;
            }

            /* Preferences and print ---------------------------------------- */

            @media (prefers-reduced-motion: reduce) {
                *,
                *::before,
                *::after {
                    animation-duration: 0.01ms !important;
                    animation-iteration-count: 1 !important;
                    transition-duration: 0.01ms !important;
                    scroll-behavior: auto !important;
                }
            }

            @media print {
                :root {
                    color-scheme: light;
                    --bg: #ffffff;
                    --surface: #ffffff;
                    --text-strong: #000000;
                    --text-muted: #444444;
                    --accent: #000000;
                }

                body {
                    padding: 0;
                }

                .tooltip,
                .status {
                    display: none !important;
                }

                .stat,
                .year {
                    break-inside: avoid;
                }

                .year__chart {
                    overflow: visible;
                }
            }
        </style>
    </head>

    <body>
        <main class="page">
            <header>
                <h1>RV-10 Build Progress</h1>
                <p id="status" class="status" role="status" aria-live="polite">
                    Loading build progress&hellip;
                </p>
            </header>

            <noscript>
                <p class="status" data-state="error">
                    This dashboard needs JavaScript to read <code>progress.json</code>.
                </p>
            </noscript>

            <section id="stats-section" aria-labelledby="stats-title" hidden>
                <h2 id="stats-title" class="sr-only">Build statistics</h2>
                <dl id="stats" class="stats"></dl>
            </section>

            <section id="activity-section" aria-labelledby="activity-title" hidden>
                <div class="section-head">
                    <h2 id="activity-title">Daily activity</h2>
                    <p class="legend">
                        <span>Less</span>
                        <span class="legend__scale" aria-hidden="true">
                            <span class="legend__swatch"></span>
                            <span class="legend__swatch" data-level="1"></span>
                            <span class="legend__swatch" data-level="2"></span>
                            <span class="legend__swatch" data-level="3"></span>
                            <span class="legend__swatch" data-level="4"></span>
                        </span>
                        <span>More</span>
                    </p>
                </div>
                <div id="years" class="years"></div>
            </section>
        </main>

        <div id="tooltip" class="tooltip" role="tooltip" hidden></div>

        <template id="tpl-stat">
            <div class="stat">
                <dt class="stat__label"></dt>
                <dd class="stat__body"><span class="stat__value"></span></dd>
            </div>
        </template>

        <template id="tpl-year">
            <section class="year">
                <h3 class="year__title"></h3>
                <div class="year__chart"></div>
            </section>
        </template>

        <script type="module">
            const CONFIG = Object.freeze({
                dataUrl: 'progress.json',
                goalHours: 2500,
                refreshMs: 15 * 60 * 1000,
                requestTimeoutMs: 15_000,
            });

            /* Heatmap geometry, in SVG user units. The SVG is drawn once at this
               size and then scaled by the viewBox, so these are "design" pixels. */
            const CELL = 18;
            const GUTTER = 6;
            const PITCH = CELL + GUTTER;
            const WEEKDAY_GUTTER = 32; // room for "Mon" / "Wed" / "Fri"
            const MONTH_GUTTER = 20; // room for the month row
            const LABELLED_ROWS = [1, 3, 5]; // Mon, Wed, Fri
            const MIN_SCALE = 0.62; // scroll rather than shrink past ~11px cells

            /* Hours >= cutoff[i] bumps a cell one colour step: five levels, four
               cutoffs. 6+ hours all render at the brightest step. */
            const LEVEL_CUTOFFS = [0.1, 2, 4, 6];

            const DAY_MS = 86_400_000;
            const SVG_NS = 'http://www.w3.org/2000/svg';

            /* Intl formatters are expensive to construct; build them once. All the
               date formatters pin UTC so an ISO date never drifts a day west of
               Greenwich. */
            const fmt = {
                hours: new Intl.NumberFormat('en-US', {
                    minimumFractionDigits: 1,
                    maximumFractionDigits: 1,
                }),
                loose: new Intl.NumberFormat('en-US', { maximumFractionDigits: 1 }),
                integer: new Intl.NumberFormat('en-US'),
                shortDate: new Intl.DateTimeFormat('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    timeZone: 'UTC',
                }),
                longDate: new Intl.DateTimeFormat('en-US', {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    timeZone: 'UTC',
                }),
                month: new Intl.DateTimeFormat('en-US', { month: 'short', timeZone: 'UTC' }),
                weekday: new Intl.DateTimeFormat('en-US', { weekday: 'short', timeZone: 'UTC' }),
                clock: new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: '2-digit' }),
            };

            const el = {
                status: document.getElementById('status'),
                stats: document.getElementById('stats'),
                statsSection: document.getElementById('stats-section'),
                activitySection: document.getElementById('activity-section'),
                years: document.getElementById('years'),
                tooltip: document.getElementById('tooltip'),
                statTemplate: document.getElementById('tpl-stat'),
                yearTemplate: document.getElementById('tpl-year'),
            };

            /* -- helpers -------------------------------------------------- */

            /** Parse `YYYY-MM-DD` at UTC midnight. `new Date('2028-02-25')` is also
             *  UTC, but formatting it without a timeZone renders the previous day
             *  for anyone west of UTC — pinning both ends avoids that. */
            const parseIsoDate = (iso) => new Date(`${iso}T00:00:00Z`);

            const toIsoDate = (timestamp) => new Date(timestamp).toISOString().slice(0, 10);

            const startOfUtcDay = (date) =>
                Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate());

            const plural = (count, word) => `${word}${count === 1 ? '' : 's'}`;

            const clamp = (value, min, max) => Math.min(Math.max(value, min), max);

            const levelFor = (hours) =>
                LEVEL_CUTOFFS.reduce((level, cutoff) => (hours >= cutoff ? level + 1 : level), 0);

            const svg = (name, attributes) => {
                const node = document.createElementNS(SVG_NS, name);
                for (const [key, value] of Object.entries(attributes)) {
                    node.setAttribute(key, value);
                }
                return node;
            };

            /* -- statistics ------------------------------------------------ */

            /* Declarative card definitions: adding a metric means adding a row,
               not another block of markup. */
            const STAT_CARDS = [
                {
                    label: 'Total Hours',
                    value: (s) => fmt.hours.format(s.total_hours),
                    notes: (s) => [
                        `${((s.total_hours / CONFIG.goalHours) * 100).toFixed(1)}% of ${fmt.integer.format(CONFIG.goalHours)} hour goal`,
                        `${fmt.hours.format(Math.max(0, CONFIG.goalHours - s.total_hours))} hours remaining`,
                    ],
                },
                {
                    label: 'Days Worked',
                    value: (s) => fmt.integer.format(s.days_worked),
                },
                {
                    label: 'Average Per Week',
                    value: (s) => fmt.hours.format(s.avg_hours_per_week),
                    notes: (s) => [
                        `Last 6 weeks: ${fmt.hours.format(s.avg_hours_last_6_weeks)} hrs/week`,
                    ],
                },
                {
                    label: 'Current Week',
                    value: (s) => fmt.hours.format(s.hours_current_week),
                    notes: (s) => [
                        `Month: ${fmt.hours.format(s.hours_current_month)} hrs`,
                        `Last 30 days: ${fmt.hours.format(s.hours_last_30_days)} hrs`,
                    ],
                },
                {
                    label: 'Est. Completion',
                    value: (s) => fmt.shortDate.format(parseIsoDate(s.est_completion_date)),
                    notes: () => ['Based on overall average'],
                },
                {
                    label: 'Est. Completion (6-week trend)',
                    value: (s) => fmt.shortDate.format(parseIsoDate(s.est_completion_date_6_weeks)),
                    notes: () => ['Based on recent pace'],
                },
                {
                    label: 'Current Streak',
                    value: (s) => fmt.integer.format(s.current_streak),
                    notes: (s) => [`${plural(s.current_streak, 'day')} worked consecutively`],
                },
                {
                    label: 'Record Streak',
                    value: (s) => fmt.integer.format(s.record_streak.days),
                    notes: (s) => [
                        `${plural(s.record_streak.days, 'day')} starting ${fmt.shortDate.format(
                            parseIsoDate(s.record_streak.start_date)
                        )}`,
                    ],
                },
            ];

            function renderStatistics(statistics) {
                const fragment = document.createDocumentFragment();

                for (const card of STAT_CARDS) {
                    const node = el.statTemplate.content.cloneNode(true);
                    node.querySelector('.stat__label').textContent = card.label;
                    node.querySelector('.stat__value').textContent = card.value(statistics);

                    const body = node.querySelector('.stat__body');
                    for (const note of card.notes?.(statistics) ?? []) {
                        const span = document.createElement('span');
                        span.className = 'stat__note';
                        span.textContent = note;
                        body.append(span);
                    }

                    fragment.append(node);
                }

                el.stats.replaceChildren(fragment);
            }

            /* -- heatmap --------------------------------------------------- */

            /** Group the flat log into `year -> Map(isoDate -> hours)`. */
            function groupByYear(log) {
                const years = new Map();

                for (const entry of log) {
                    const year = Number(entry.date.slice(0, 4));
                    let days = years.get(year);
                    if (!days) years.set(year, (days = new Map()));
                    days.set(entry.date, Number(entry.hours) || 0);
                }

                return years;
            }

            /**
             * Draw one year as a GitHub-style grid: a column per week, a row per
             * weekday. Because the grid is generated from Jan 1 to Dec 31 directly,
             * days from neighbouring years are never created in the first place.
             */
            function buildHeatmap(year, days) {
                const yearStart = Date.UTC(year, 0, 1);
                const today = startOfUtcDay(new Date());
                // Don't draw days that haven't happened yet.
                const yearEnd = clamp(today, yearStart, Date.UTC(year, 11, 31));
                const startWeekday = new Date(yearStart).getUTCDay();
                const dayCount = Math.round((yearEnd - yearStart) / DAY_MS) + 1;
                const columns = Math.ceil((startWeekday + dayCount) / 7);

                const width = WEEKDAY_GUTTER + columns * PITCH - GUTTER;
                const height = MONTH_GUTTER + 7 * PITCH - GUTTER;

                const chart = svg('svg', {
                    class: 'heatmap',
                    viewBox: `0 0 ${width} ${height}`,
                    width,
                    height,
                    role: 'img',
                    style: `max-inline-size:${width}px;min-inline-size:${Math.round(width * MIN_SCALE)}px`,
                });

                chart.append(
                    buildMonthLabels(year, yearStart, yearEnd, startWeekday, columns),
                    buildWeekdayLabels()
                );

                const cells = svg('g', {});
                let totalHours = 0;
                let daysWorked = 0;

                for (let offset = 0; offset < dayCount; offset += 1) {
                    const iso = toIsoDate(yearStart + offset * DAY_MS);
                    const hours = days.get(iso) ?? 0;

                    if (hours > 0) {
                        totalHours += hours;
                        daysWorked += 1;
                    }

                    cells.append(
                        svg('rect', {
                            class: 'day',
                            x: WEEKDAY_GUTTER + Math.floor((startWeekday + offset) / 7) * PITCH,
                            y: MONTH_GUTTER + ((startWeekday + offset) % 7) * PITCH,
                            width: CELL,
                            height: CELL,
                            rx: 2,
                            'data-level': levelFor(hours),
                            'data-date': iso,
                            'data-hours': hours,
                        })
                    );
                }

                chart.append(cells);
                chart.setAttribute(
                    'aria-label',
                    `${year}: ${fmt.hours.format(totalHours)} hours across ${daysWorked} ${plural(daysWorked, 'day')}.`
                );

                return chart;
            }

            function buildMonthLabels(year, yearStart, yearEnd, startWeekday, columns) {
                const group = svg('g', {});

                for (let month = 0; month < 12; month += 1) {
                    const first = Date.UTC(year, month, 1);
                    if (first > yearEnd) break;

                    const offset = Math.round((first - yearStart) / DAY_MS);
                    const weekday = new Date(first).getUTCDay();
                    // Anchor to the first whole week of the month so a label never
                    // sits above a column that is mostly the previous month.
                    const column =
                        Math.floor((startWeekday + offset) / 7) + (weekday === 0 ? 0 : 1);
                    if (column >= columns) break;

                    const label = svg('text', {
                        x: WEEKDAY_GUTTER + column * PITCH,
                        y: MONTH_GUTTER - 8,
                    });
                    label.textContent = fmt.month.format(new Date(first));
                    group.append(label);
                }

                return group;
            }

            function buildWeekdayLabels() {
                const group = svg('g', {});
                // 2024-01-07 was a Sunday, so +row lands on that row's weekday.
                const sunday = Date.UTC(2024, 0, 7);

                for (const row of LABELLED_ROWS) {
                    const label = svg('text', {
                        x: 0,
                        y: MONTH_GUTTER + row * PITCH + CELL / 2,
                        'dominant-baseline': 'central',
                    });
                    label.textContent = fmt.weekday.format(new Date(sunday + row * DAY_MS));
                    group.append(label);
                }

                return group;
            }

            function renderChart(log) {
                const years = groupByYear(log);
                const fragment = document.createDocumentFragment();

                for (const year of [...years.keys()].sort((a, b) => b - a)) {
                    const node = el.yearTemplate.content.cloneNode(true);
                    node.querySelector('.year__title').textContent = year;
                    node.querySelector('.year__chart').append(buildHeatmap(year, years.get(year)));
                    fragment.append(node);
                }

                el.years.replaceChildren(fragment);
            }

            /* -- tooltip --------------------------------------------------- */

            /* One delegated listener for every cell in every year, attached once. */
            function initTooltip() {
                const hide = () => {
                    el.tooltip.hidden = true;
                };

                el.years.addEventListener('pointerover', (event) => {
                    const cell = event.target.closest?.('.day');
                    if (cell) showTooltip(cell);
                });

                el.years.addEventListener('pointerout', (event) => {
                    if (event.target.closest?.('.day')) hide();
                });

                el.years.addEventListener('scroll', hide, { capture: true, passive: true });
                window.addEventListener('blur', hide);
            }

            function showTooltip(cell) {
                const hours = Number(cell.dataset.hours);
                el.tooltip.textContent = `${fmt.loose.format(hours)} ${plural(hours, 'hour')} on ${fmt.longDate.format(
                    parseIsoDate(cell.dataset.date)
                )}`;
                el.tooltip.hidden = false;

                // Measure only after the text is in place, or the width is stale.
                const anchor = cell.getBoundingClientRect();
                const tip = el.tooltip.getBoundingClientRect();
                const x = clamp(
                    anchor.left + anchor.width / 2 - tip.width / 2,
                    8,
                    window.innerWidth - tip.width - 8
                );
                const above = anchor.top - tip.height - 8;

                el.tooltip.style.setProperty('--tip-x', `${Math.round(x)}px`);
                el.tooltip.style.setProperty(
                    '--tip-y',
                    `${Math.round(above < 8 ? anchor.bottom + 8 : above)}px`
                );
            }

            /* -- data ------------------------------------------------------ */

            /** Sections stay hidden until a load succeeds, so a first-load failure
             *  shows the banner alone rather than an empty legend and a blank grid. */
            function showContent(visible) {
                el.statsSection.hidden = !visible;
                el.activitySection.hidden = !visible;
            }

            function setStatus(message, state = 'info') {
                el.status.textContent = message;
                el.status.dataset.state = state;
            }

            async function fetchProgress() {
                const response = await fetch(CONFIG.dataUrl, {
                    // A long-lived dashboard must not be served its own stale copy.
                    cache: 'no-store',
                    signal: AbortSignal.timeout(CONFIG.requestTimeoutMs),
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status} ${response.statusText}`);
                }

                const data = await response.json();

                if (!Array.isArray(data?.log) || !data?.statistics) {
                    throw new Error('unexpected shape — expected { log: [], statistics: {} }');
                }

                return data;
            }

            function describeFreshness(log) {
                const lastWorked = log.findLast((entry) => Number(entry.hours) > 0);
                const updated = `Updated ${fmt.clock.format(new Date())}`;

                return lastWorked
                    ? `Last logged ${fmt.shortDate.format(parseIsoDate(lastWorked.date))} · ${updated}`
                    : updated;
            }

            let hasRendered = false;

            async function refresh() {
                try {
                    const data = await fetchProgress();
                    renderStatistics(data.statistics);
                    renderChart(data.log);
                    hasRendered = true;
                    showContent(true);
                    setStatus(describeFreshness(data.log));
                } catch (error) {
                    // Keep the last good render on screen; only the banner changes.
                    showContent(hasRendered);
                    setStatus(`Could not load ${CONFIG.dataUrl} — ${error.message}`, 'error');
                }
            }

            /* A self-rescheduling timeout rather than setInterval: a slow fetch can
               never overlap the next one, and a hidden tab does no work at all. */
            let refreshTimer = null;

            function scheduleRefresh() {
                clearTimeout(refreshTimer);
                refreshTimer = setTimeout(async () => {
                    await refresh();
                    scheduleRefresh();
                }, CONFIG.refreshMs);
            }

            document.addEventListener('visibilitychange', async () => {
                if (document.visibilityState === 'hidden') {
                    clearTimeout(refreshTimer);
                    return;
                }
                await refresh();
                scheduleRefresh();
            });

            initTooltip();
            await refresh();
            scheduleRefresh();
        </script>
    </body>
</html>
